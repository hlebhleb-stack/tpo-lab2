<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Colors */
      --bg: #ffffff;
      --sidebar: #f4f4f4;
      --text: #1a1a1a;
      --muted: #a0a0a0;
      --accent: #9e8a82;
      --line: rgba(0,0,0,.09);
      --error: #b87070;
      --error-dim: rgba(184,112,112,.07);
      --success: var(--accent);

      /* Fonts */
      --serif: 'Lora', serif;
      --sans: 'Outfit', sans-serif;

      /* Type scale */
      --text-sm:   12px;  /* sub-labels, meta, tags */
      --text-base: 14px;  /* everything else */
      --text-lg:   20px;  /* headings */
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--text-base); /* 14px */
      line-height: 1.5;
    }

    /* Auth modal */
    .auth-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 300;
      align-items: center; justify-content: center;
    }
    .auth-modal.open { display: flex; }
    .auth-modal-box {
      background: var(--bg); width: 300px; padding: 36px 32px 28px;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; font-size: 18px;
      color: var(--muted); cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .login-sidebar-btn {
      background: none; border: none; color: var(--accent);
      font-family: var(--sans); font-size: var(--text-sm);
      font-weight: 500; cursor: pointer; padding: 0;
    }
    .login-sidebar-btn:hover { opacity: .75; }

    /* Book animation */
    .book-scene {
      position: relative;
      width: 160px;
      height: 116px;
      perspective: 900px;
    }
    .book-left, .book-right {
      position: absolute;
      top: 0;
      height: 116px;
      width: 78px;
    }
    .book-left {
      right: 50%;
      background: #e0e0e0;
      border-radius: 2px 0 0 2px;
      box-shadow: inset -3px 0 6px rgba(0,0,0,.12);
    }
    .book-right {
      left: 50%;
      background: #e0e0e0;
      border-radius: 0 2px 2px 0;
    }
    /* text lines on static pages */
    .book-left::before, .book-right::before {
      content: '';
      position: absolute;
      top: 14px; left: 10px; right: 10px;
      height: 88px;
      background: repeating-linear-gradient(
        transparent, transparent 8px,
        rgba(0,0,0,.08) 8px, rgba(0,0,0,.08) 9px
      );
    }
    .book-spine {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 116px;
      background: #c0c0c0;
      z-index: 10;
    }
    /* turning page container */
    .page-wrap {
      position: absolute;
      top: 0;
      left: 50%;
      width: 78px;
      height: 116px;
      transform-origin: left center;
      transform-style: preserve-3d;
      animation: flip 3.2s ease-in-out infinite;
      z-index: 5;
    }
    .page-front, .page-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
    }
    .page-front {
      background: #f5f5f5;
      border-radius: 0 2px 2px 0;
      box-shadow: 2px 0 8px rgba(0,0,0,.10);
    }
    .page-front::before {
      content: '';
      position: absolute;
      top: 14px; left: 8px; right: 12px;
      height: 88px;
      background: repeating-linear-gradient(
        transparent, transparent 8px,
        rgba(0,0,0,.07) 8px, rgba(0,0,0,.07) 9px
      );
    }
    .page-back {
      background: #e8e8e8;
      border-radius: 2px 0 0 2px;
      transform: rotateY(180deg);
    }
    @keyframes flip {
      0%       { transform: rotateY(0deg);    }
      15%      { transform: rotateY(0deg);    }
      55%      { transform: rotateY(-176deg); }
      70%      { transform: rotateY(-176deg); }
      85%      { transform: rotateY(-176deg); opacity: 1; }
      95%, 100%{ transform: rotateY(-176deg); opacity: 0; }
    }

    .login-form-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box { width: 280px; }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: var(--text-sm); color: var(--muted); margin-bottom: 6px; letter-spacing: .3px; }
    .field label .req { color: var(--error); margin-left: 2px; }
    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      padding: 7px 0;
      font-family: var(--sans);
      font-size: var(--text-base);
      outline: none;
      transition: border-color .15s;
    }
    .field input::placeholder { color: var(--muted); }
    .field input:focus { border-bottom-color: var(--accent); }
    .field.error input { border-bottom-color: var(--error); }
    .field-error { font-size: var(--text-sm); color: var(--error); margin-top: 4px; display: none; }
    .field.error .field-error { display: block; }

    .btn-primary {
      width: 100%;
      padding: 10px 0;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-family: var(--sans);
      font-size: var(--text-base);
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      letter-spacing: .2px;
    }
    .btn-primary:hover { opacity: .88; }

    .hint { margin-top: 24px; font-size: var(--text-sm); color: rgba(0,0,0,.25); line-height: 1.7; }
    .hint strong { font-weight: 400; }

    .auth-toggle { margin-top: 20px; font-size: var(--text-sm); color: var(--muted); }
    .auth-toggle button {
      background: none; border: none; color: var(--accent);
      font-family: var(--sans); font-size: var(--text-sm);
      cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
    }

    /* App */
    #page-app { display: flex; flex-direction: row; min-height: 100vh; }

    .sidebar {
      width: 190px;
      flex-shrink: 0;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 32px 18px 26px;
      height: 100vh;
      position: sticky;
      top: 0;
    }
    .sidebar-word {
      font-family: var(--serif);
      font-size: var(--text-base);
      font-weight: 400;
      color: var(--accent);
      margin-bottom: 32px;
    }
    .nav { display: flex; flex-direction: column; gap: 1px; }
    .nav-item {
      padding: 7px 10px;
      font-size: var(--text-base);
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      font-family: var(--sans);
      text-align: left;
      transition: color .12s, background .12s;
    }
    .nav-item:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .nav-item.active { color: var(--text); background: rgba(0,0,0,.07); }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .sidebar-name { color: var(--text); font-size: var(--text-sm); margin-bottom: 5px; font-weight: 500; }
    .logout-btn {
      background: none; border: none; color: var(--muted);
      font-family: var(--sans); font-size: var(--text-sm); cursor: pointer; padding: 0;
    }
    .logout-btn:hover { color: var(--text); }

    .main { flex: 1; padding: 32px 36px; overflow-y: auto; }

    /* Search */
    .search-row { display: flex; margin-bottom: 6px; }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      padding: 8px 0;
      font-family: var(--sans);
      font-size: var(--text-base);
      outline: none;
      transition: border-color .15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-bottom-color: var(--accent); }
    .search-btn {
      background: none; border: none;
      border-bottom: 1px solid var(--line);
      color: var(--muted); font-family: var(--sans); font-size: var(--text-base);
      padding: 8px 0 8px 14px; cursor: pointer; white-space: nowrap;
    }
    .search-btn:hover { color: var(--text); }

    .search-msg {
      font-size: var(--text-sm); color: var(--error);
      min-height: 18px; margin-bottom: 12px; margin-top: 4px;
    }

    .catalog-label {
      font-size: var(--text-sm); color: var(--muted);
      margin-bottom: 18px;
    }

    /* Catalog controls */
    .catalog-controls {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .ctrl-select {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--text-sm);
      padding: 4px 0;
      cursor: pointer;
      outline: none;
    }
    .ctrl-select:focus { border-bottom-color: var(--accent); }

    .pagination {
      display: flex; align-items: center; gap: 8px;
      margin-top: 28px;
    }
    .page-btn {
      background: none; border: 1px solid var(--line);
      color: var(--muted); font-family: var(--sans);
      font-size: var(--text-sm); padding: 4px 10px;
      cursor: pointer; transition: color .12s, border-color .12s;
    }
    .page-btn:hover { color: var(--text); border-color: var(--muted); }
    .page-btn.active { color: var(--accent); border-color: var(--accent); }
    .page-btn:disabled { opacity: .35; cursor: default; }

    /* Book grid — 6 columns */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 24px 18px;
    }
    .book-item { display: flex; flex-direction: column; gap: 8px; }

    .book-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .book-unavail-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.30);
    }

    .book-info { width: 100%; }
    .book-title {
      font-family: var(--serif);
      font-size: var(--text-base);
      font-weight: 400;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 2px;
    }
    .book-author { font-size: var(--text-sm); color: var(--muted); margin-bottom: 5px; }
    .book-actions { display: flex; align-items: center; justify-content: space-between; }
    .avail { font-size: var(--text-sm); color: var(--success); }
    .unavail { font-size: var(--text-sm); color: var(--muted); }
    .order-btn {
      background: none; border: none; color: var(--accent);
      font-family: var(--sans); font-size: var(--text-sm); font-weight: 500;
      cursor: pointer; padding: 0;
    }
    .order-btn:hover { opacity: .7; }

    /* List view */
    .tab-head {
      font-family: var(--serif);
      font-size: var(--text-lg);
      font-weight: 400;
      margin-bottom: 22px;
    }
    .list-rows { display: flex; flex-direction: column; max-width: 640px; }
    .list-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      gap: 16px;
    }
    .list-row:first-child { border-top: 1px solid var(--line); }
    .list-row-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .list-cover {
      width: 36px; height: 52px; flex-shrink: 0;
      overflow: hidden;
    }
    .list-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .list-info { min-width: 0; }
    .list-title {
      font-family: var(--serif);
      font-size: var(--text-base); font-weight: 400; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .list-sub { font-size: var(--text-sm); color: var(--muted); margin-top: 2px; }
    .list-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .tag {
      font-size: var(--text-sm); padding: 3px 8px;
      background: rgba(0,0,0,.06); color: var(--muted); white-space: nowrap;
    }
    .tag-ok { color: var(--accent); background: rgba(158,138,130,.10); }
    .tag-debt { color: var(--accent); background: rgba(158,138,130,.12); }
    .cancel-btn {
      background: none; border: none; color: var(--muted);
      font-family: var(--sans); font-size: var(--text-sm);
      cursor: pointer; padding: 0; white-space: nowrap;
    }
    .cancel-btn:hover { color: var(--error); }

    .empty { color: var(--muted); font-size: var(--text-base); padding: 28px 0; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--accent); color: #ffffff;
      padding: 9px 18px; font-size: var(--text-base);
      opacity: 0; transition: opacity .18s, transform .18s;
      pointer-events: none; z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--error); }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Auth modal -->
<div class="auth-modal" id="auth-modal">
  <div class="auth-modal-box">
    <button class="modal-close" id="modal-close">×</button>

    <form id="login-form">
      <div class="field" id="f-login">
        <label>Логин <span class="req">*</span></label>
        <input type="text" name="username" placeholder="Введите логин" autocomplete="username">
        <div class="field-error" id="login-error">Неверный логин или пароль</div>
      </div>
      <div class="field">
        <label>Пароль <span class="req">*</span></label>
        <input type="password" name="password" placeholder="Введите пароль" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Войти</button>
    </form>

    <form id="register-form" style="display:none">
      <div class="field" id="f-reg-name">
        <label>Полное имя <span class="req">*</span></label>
        <input type="text" name="full_name" placeholder="Фамилия Имя Отчество" autocomplete="name">
        <div class="field-error">Введите полное имя</div>
      </div>
      <div class="field" id="f-reg-login">
        <label>Логин <span class="req">*</span></label>
        <input type="text" name="username" placeholder="Не менее 3 символов" autocomplete="username">
        <div class="field-error" id="reg-login-error">Логин должен содержать не менее 3 символов</div>
      </div>
      <div class="field" id="f-reg-pass">
        <label>Пароль <span class="req">*</span></label>
        <input type="password" name="password" placeholder="Не менее 4 символов" autocomplete="new-password">
        <div class="field-error">Пароль должен содержать не менее 4 символов</div>
      </div>
      <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>

    <div class="auth-toggle" id="auth-toggle">
      Нет аккаунта? <button type="button" id="switch-auth">Зарегистрироваться</button>
    </div>
    <div class="hint" id="login-hint">
      smirnov / 123456<br>kozlov / 123456
    </div>
  </div>
</div>

<!-- App -->
<div id="page-app">
  <aside class="sidebar">
    <nav class="nav">
      <button class="nav-item active" data-tab="catalog">Каталог</button>
      <button class="nav-item" data-tab="orders">Мои заявки</button>
      <button class="nav-item" data-tab="debts">Задолженности</button>
    </nav>
    <div class="sidebar-bottom">
      <div id="sidebar-user" style="display:none">
        <div class="sidebar-name" id="nav-name"></div>
        <button class="logout-btn" id="logout-btn">Выйти</button>
      </div>
      <button class="login-sidebar-btn" id="login-sidebar-btn">Войти</button>
    </div>
  </aside>

  <div class="main">

    <!-- Catalog -->
    <div class="tab-content" id="tab-catalog">
      <div class="search-row">
        <input class="search-input" id="search-input" type="text" placeholder="Название или автор">
        <button class="search-btn" id="search-btn">Найти</button>
      </div>
      <div class="search-msg" id="search-msg"></div>
      <div class="catalog-controls">
        <select class="ctrl-select" id="sort-select">
          <option value="">По умолчанию</option>
          <option value="title_asc">Название А–Я</option>
          <option value="title_desc">Название Я–А</option>
          <option value="author_asc">Автор А–Я</option>
          <option value="year_asc">Год по возрастанию</option>
          <option value="year_desc">Год по убыванию</option>
        </select>
        <select class="ctrl-select" id="filter-select">
          <option value="">Все книги</option>
          <option value="available">В наличии</option>
          <option value="unavailable">Нет в наличии</option>
        </select>
        <span class="catalog-label" id="catalog-label" style="margin-bottom:0; margin-left:auto"></span>
      </div>
      <div class="book-grid" id="book-grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- Orders -->
    <div class="tab-content" id="tab-orders" style="display:none">
      <div class="tab-head">Мои заявки</div>
      <div class="list-rows" id="orders-list"></div>
    </div>

    <!-- Debts -->
    <div class="tab-content" id="tab-debts" style="display:none">
      <div class="tab-head">Задолженности</div>
      <div class="list-rows" id="debts-list"></div>
    </div>

  </div>
</div>

<script>
const COVER_COLORS = {
  1:'#8B7355',2:'#6B7A8D',3:'#7B8B6B',4:'#9B7070',
  5:'#8B7A50',6:'#6B7B6B',7:'#6B8B8A',8:'#8A7090'
};

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 3200);
}

// Tabs
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + btn.dataset.tab).style.display = '';
    if (!currentUser && (btn.dataset.tab === 'orders' || btn.dataset.tab === 'debts')) {
      const el = document.getElementById(btn.dataset.tab === 'orders' ? 'orders-list' : 'debts-list');
      el.innerHTML = '<div class="empty"><button class="login-sidebar-btn" style="font-size:var(--text-base)" onclick="openAuthModal()">Войдите в аккаунт</button></div>';
      return;
    }
    if (btn.dataset.tab === 'orders') loadOrders();
    if (btn.dataset.tab === 'debts') loadDebts();
  });
});

// Auth modal
let currentUser = null;

function openAuthModal() {
  document.getElementById('auth-modal').classList.add('open');
}
function closeAuthModal() {
  document.getElementById('auth-modal').classList.remove('open');
}

document.getElementById('login-sidebar-btn').addEventListener('click', openAuthModal);
document.getElementById('modal-close').addEventListener('click', closeAuthModal);
document.getElementById('auth-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAuthModal();
});

function setUser(me) {
  currentUser = me;
  document.getElementById('nav-name').textContent = me.full_name;
  document.getElementById('sidebar-user').style.display = '';
  document.getElementById('login-sidebar-btn').style.display = 'none';
}

// Auth toggle
let isRegister = false;
document.getElementById('switch-auth').addEventListener('click', () => {
  isRegister = !isRegister;
  document.getElementById('login-form').style.display    = isRegister ? 'none' : '';
  document.getElementById('register-form').style.display = isRegister ? '' : 'none';
  document.getElementById('login-hint').style.display    = isRegister ? 'none' : '';
  document.getElementById('switch-auth').textContent     = isRegister ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-toggle').childNodes[0].textContent = isRegister ? 'Уже есть аккаунт? ' : 'Нет аккаунта? ';
  document.getElementById('f-login').classList.remove('error');
  ['f-reg-name','f-reg-login','f-reg-pass'].forEach(id => document.getElementById(id).classList.remove('error'));
});

// Login
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
  }).then(r => r.json());
  if (!r.success) { document.getElementById('f-login').classList.add('error'); return; }
  document.getElementById('f-login').classList.remove('error');
  await enterApp();
});

// Register
document.getElementById('register-form').addEventListener('submit', async e => {
  e.preventDefault();
  ['f-reg-name','f-reg-login','f-reg-pass'].forEach(id => document.getElementById(id).classList.remove('error'));

  const fd = new FormData(e.target);
  const full_name = fd.get('full_name').trim();
  const username  = fd.get('username').trim();
  const password  = fd.get('password');

  if (!full_name) { document.getElementById('f-reg-name').classList.add('error'); return; }
  if (username.length < 3) { document.getElementById('f-reg-login').classList.add('error'); return; }
  if (password.length < 4) { document.getElementById('f-reg-pass').classList.add('error'); return; }

  const r = await fetch('/api/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, password, full_name })
  }).then(r => r.json());

  if (!r.success) {
    document.getElementById('reg-login-error').textContent = r.error;
    document.getElementById('f-reg-login').classList.add('error');
    return;
  }
  showToast('Добро пожаловать, ' + full_name.split(' ')[1] + '!');
  await enterApp();
});

async function enterApp() {
  const me = await fetch('/api/me').then(r => r.json());
  setUser(me);
  closeAuthModal();
  loadCatalog();
}

// Catalog
const PAGE_SIZE = 6;
let catalogState = { books: [], page: 1 };

function applyControls(books) {
  const sort   = document.getElementById('sort-select').value;
  const filter = document.getElementById('filter-select').value;

  let result = [...books];
  if (filter === 'available')   result = result.filter(b => b.available > 0);
  if (filter === 'unavailable') result = result.filter(b => b.available === 0);

  if (sort === 'title_asc')  result.sort((a,b) => a.title.localeCompare(b.title, 'ru'));
  if (sort === 'title_desc') result.sort((a,b) => b.title.localeCompare(a.title, 'ru'));
  if (sort === 'author_asc') result.sort((a,b) => a.author.localeCompare(b.author, 'ru'));
  if (sort === 'year_asc')   result.sort((a,b) => a.year - b.year);
  if (sort === 'year_desc')  result.sort((a,b) => b.year - a.year);

  return result;
}

function renderPage() {
  const filtered = applyControls(catalogState.books);
  const total = filtered.length;
  const pages = Math.ceil(total / PAGE_SIZE) || 1;
  const p = Math.min(catalogState.page, pages);
  catalogState.page = p;

  const slice = filtered.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);
  const labelEl = document.getElementById('catalog-label');
  labelEl.textContent = total > 0 ? `${total} книг` : '';

  renderBooks(slice);

  // Pagination
  const pg = document.getElementById('pagination');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="goPage(${p-1})" ${p===1?'disabled':''}>←</button>`;
  for (let i = 1; i <= pages; i++)
    html += `<button class="page-btn${i===p?' active':''}" onclick="goPage(${i})">${i}</button>`;
  html += `<button class="page-btn" onclick="goPage(${p+1})" ${p===pages?'disabled':''}>→</button>`;
  pg.innerHTML = html;
}

function goPage(n) { catalogState.page = n; renderPage(); }

function renderBooks(books) {
  const fb = (id) => COVER_COLORS[id] || '#8B7A6B';
  document.getElementById('book-grid').innerHTML = books.map(b => {
    const avail = b.available > 0;
    return `<div class="book-item">
      <div class="book-cover" style="background:${fb(b.id)}">
        <img src="/covers/${b.id}.jpg" alt="" onerror="this.style.display='none'">
        ${!avail ? '<div class="book-unavail-overlay"></div>' : ''}
      </div>
      <div class="book-info" style="width:100%">
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author}</div>
        <div class="book-actions">
          ${avail
            ? `<span class="avail">В наличии · ${b.available} экз.</span><button class="order-btn" onclick="orderBook(${b.id})">Заказать</button>`
            : `<span class="unavail">Нет в наличии</span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function loadCatalog(q) {
  const msgEl = document.getElementById('search-msg');
  msgEl.textContent = '';

  const isSearch = q !== undefined;
  const url = isSearch ? `/api/books?q=${encodeURIComponent(q)}` : '/api/books';
  const data = await fetch(url).then(r => r.json());

  if (data.error) {
    msgEl.textContent = data.message;
    catalogState.books = [];
    renderPage();
    return;
  }

  const books = data.books || [];
  if (isSearch && q.trim().length >= 2 && books.length === 0) {
    msgEl.textContent = 'По вашему запросу ничего не найдено';
    catalogState.books = [];
    renderPage();
    return;
  }

  catalogState.books = books;
  catalogState.page = 1;
  renderPage();
}

document.getElementById('sort-select').addEventListener('change', () => { catalogState.page = 1; renderPage(); });
document.getElementById('filter-select').addEventListener('change', () => { catalogState.page = 1; renderPage(); });

document.getElementById('search-btn').addEventListener('click', () => {
  loadCatalog(document.getElementById('search-input').value);
});
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadCatalog(e.target.value);
});
// Clear error when input is cleared
document.getElementById('search-input').addEventListener('input', e => {
  if (e.target.value === '') {
    document.getElementById('search-msg').textContent = '';
    loadCatalog();
  }
});

async function orderBook(bookId) {
  if (!currentUser) {
    showToast('Для оформления заявки необходимо авторизоваться', true);
    openAuthModal();
    return;
  }
  const r = await fetch('/api/orders', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({book_id: bookId})
  }).then(r => r.json());
  if (!r.success) { showToast(r.error, true); return; }
  showToast(r.message);
  const q = document.getElementById('search-input').value;
  loadCatalog(q || undefined);
}

// Orders
async function loadOrders() {
  const STATUS = {active:'Принята', issued:'Выдана', returned:'Возвращена', cancelled:'Отменена'};
  const orders = await fetch('/api/orders').then(r => r.json());
  const el = document.getElementById('orders-list');
  if (!orders.length) { el.innerHTML = '<div class="empty">Заявок пока нет</div>'; return; }
  el.innerHTML = orders.map(o => `
    <div class="list-row" id="order-row-${o.id}">
      <div class="list-row-left">
        <div class="list-cover" style="background:${COVER_COLORS[o.book_id]||'#8B7A6B'}">
          <img src="/covers/${o.book_id}.jpg" alt="" onerror="this.style.display='none'">
        </div>
        <div class="list-info">
          <div class="list-title">${o.title}</div>
          <div class="list-sub">${o.author}</div>
          <div class="list-sub">Оформлена ${new Date(o.ordered_at).toLocaleDateString('ru')}</div>
        </div>
      </div>
      <div class="list-right">
        <span class="tag tag-ok">${STATUS[o.status] || o.status}</span>
        ${o.status === 'active'
          ? `<button class="cancel-btn" onclick="cancelOrder(${o.id})">Отменить</button>`
          : ''}
      </div>
    </div>`).join('');
}

async function cancelOrder(id) {
  const r = await fetch(`/api/orders/${id}`, {method: 'DELETE'}).then(r => r.json());
  if (!r.success) { showToast(r.error, true); return; }
  showToast(r.message);
  loadOrders();
  loadCatalog(document.getElementById('search-input').value || undefined);
}

// Debts
async function loadDebts() {
  const debts = await fetch('/api/debts').then(r => r.json());
  const el = document.getElementById('debts-list');
  if (!debts.length) { el.innerHTML = '<div class="empty">Задолженностей нет</div>'; return; }
  el.innerHTML = debts.map(d => `
    <div class="list-row">
      <div class="list-row-left">
        <div class="list-info">
          <div class="list-title">${d.title}</div>
          <div class="list-sub">${d.author}</div>
          <div class="list-sub">Срок возврата: ${new Date(d.due_date).toLocaleDateString('ru')}</div>
        </div>
      </div>
      <div class="list-right">
        ${d.is_overdue
          ? `<span class="tag tag-debt">Просрочка ${d.overdue_days} дн.</span>`
          : '<span class="tag tag-ok">Вовремя</span>'}
      </div>
    </div>`).join('');
}

// Logout
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', {method:'POST'});
  currentUser = null;
  document.getElementById('sidebar-user').style.display = 'none';
  document.getElementById('login-sidebar-btn').style.display = '';
  loadCatalog();
});

// Session check
fetch('/api/me').then(r => r.ok ? r.json() : null).then(me => {
  if (me) setUser(me);
  loadCatalog();
});
</script>
